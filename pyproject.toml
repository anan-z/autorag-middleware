[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autorag-middleware"
version = "0.3.3"
description = "Conversation-scoped state-tracking RAG middleware for LLM chat clients (OpenAI-compatible proxy)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AutoRAG Contributors" }]
keywords = ["rag", "llm", "middleware", "proxy", "openai-compatible", "state-tracking", "memory"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "platformdirs>=4.0.0",
    "rich>=13.7.0",
    "numpy>=1.24.0",
    "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
ner = ["spacy>=3.7.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0"]

[project.scripts]
autorag = "autorag.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["autorag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
