# AutoRAG Middleware 0.4.0 — conservative memory by default
host: "127.0.0.1"
port: 8000
max_injected_tokens: 1500
context_window: 8000
default_conversation_id: "default"

extraction:
  enabled: true
  use_spacy: false
  min_confidence: 0.70
  # heuristic = deterministic, conservative, no extra LLM calls
  # llm = same-model structured extraction
  # hybrid = heuristic plus LLM only when explicitly configured
  mode: "heuristic"
  llm_every_n_turns: 0
  llm_max_tokens: 300
  llm_temperature: 0.0

validation:
  enabled: true
  # Memory conflicts: off | flag | reconcile
  on_conflict: "reconcile"
  # Draft-vs-memory check: off | flag | soft | hard | reconcile
  response_policy: "hard"
  max_retries: 1
  # Only needed for semantic claims the deterministic checker cannot see.
  # Keep false for the cheapest/safest default.
  use_llm_claims: false
  extra_patterns: []

backends:
  default:
    api_base: "http://127.0.0.1:1234/v1"
    api_key: "not-needed"
    model: "local-model"
